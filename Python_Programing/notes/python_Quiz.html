<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Mastery Quiz</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-color: #f8fafc;
      --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --primary-accent: #818cf8;
      --primary-hover: #6366f1;
      --option-bg: rgba(255, 255, 255, 0.05);
      --option-hover: rgba(129, 140, 248, 0.2);
      --option-selected: rgba(129, 140, 248, 0.4);
      --code-bg: rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #e0e7ff, #fae8ff, #fbcfe8);
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.6);
      --text-color: #1e293b;
      --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      --primary-accent: #4f46e5;
      --primary-hover: #4338ca;
      --option-bg: rgba(255, 255, 255, 0.6);
      --option-hover: rgba(79, 70, 229, 0.15);
      --option-selected: rgba(79, 70, 229, 0.3);
      --code-bg: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 30px;
      width: 100%;
      max-width: 650px;
      position: relative;
    }

    /* Header Controls */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .theme-switch {
      background: var(--option-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }

    /* Form Styles */
    .input-group {
      margin: 20px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--option-bg);
      color: var(--text-color);
      font-size: 16px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary-accent);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    /* Quiz Screen Header */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .timer {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 6px 12px;
      border-radius: 12px;
      color: #ef4444;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    pre {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 8px;
      font-family: 'Courier New', Courier, monospace;
      margin-bottom: 15px;
      white-space: pre-wrap;
      border: 1px solid var(--glass-border);
    }

    /* Options */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: var(--option-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-color);
      padding: 12px;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
    }

    .option-btn:hover {
      background: var(--option-hover);
    }

    .option-btn.selected {
      background: var(--option-selected);
      border-color: var(--primary-accent);
    }

    /* Results */
    .result-stat {
      font-size: 18px;
      margin: 10px 0;
    }

    .motivation-msg {
      margin-top: 20px;
      padding: 15px;
      background: var(--option-bg);
      border-radius: 10px;
      font-style: italic;
      text-align: center;
      border-left: 4px solid var(--primary-accent);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <div class="top-bar">
      <h3>Python MCQs</h3>
      <button class="theme-switch" id="theme-btn" onclick="toggleTheme()">🌙 Dark</button>
    </div>

    <div id="start-screen">
      <h2>Welcome to the Python Challenge</h2>
      <p style="margin-top: 5px; opacity: 0.8;">30 Questions | 15 Seconds Per Question</p>
      <div class="input-group">
        <label for="student-name">Enter your name to begin:</label>
        <input type="text" id="student-name" placeholder="e.g., John Doe" required />
      </div>
      <button class="btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="quiz-header">
        <span id="question-tracker">Question 1/30</span>
        <span class="timer" id="timer">Time: 15s</span>
      </div>
      <div class="question-text" id="question-text"></div>
      <pre id="code-block" class="hidden"><code id="code-text"></code></pre>
      <div class="options-container" id="options-container"></div>
      <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="result-screen" class="hidden">
      <h2>Quiz Completed!</h2>
      <hr style="margin: 15px 0; border: none; border-top: 1px solid var(--glass-border);" />
      <div class="result-stat">Student Name: <strong id="res-name"></strong></div>
      <div class="result-stat">Score: <strong id="res-score"></strong> / 30</div>
      <div class="result-stat">Percentage: <strong id="res-percentage"></strong>%</div>
      <div class="motivation-msg" id="motivation-msg"></div>
      <button class="btn" onclick="location.reload()" style="margin-top: 20px;">Restart Quiz</button>
    </div>
  </div>

  <script>
    const questions = [
      // Basics & Types
      { q: "What is the correct file extension for Python files?", options: [".pt", ".pyt", ".py", ".pyw"], ans: 2 },
      { q: "Which of the following is used to define a block of code in Python?", options: ["Curly braces", "Parentheses", "Indentation", "Semicolons"], ans: 2 },
      { q: "How do you insert comments in Python code?", options: ["// Comment", "/* Comment */", "", "# Comment"], ans: 3 },
      { q: "What is the output of built-in function type([])?", options: ["<class 'tuple'>", "<class 'list'>", "<class 'array'>", "<class 'set'>"], ans: 1 },
      { q: "Which data type is immutable in Python?", options: ["List", "Dictionary", "Set", "Tuple"], ans: 3 },
      { q: "What will be the output of print(type(1/2))?", options: ["<class 'int'>", "<class 'float'>", "<class 'double'>", "<class 'number'>"], ans: 1 },
      { q: "Which keyword is used to declare a variable in Python?", options: ["var", "let", "dim", "None of the above"], ans: 3 },

      // Operators & Operands
      { q: "Which operator is used for exponentiation (power) in Python?", options: ["^", "**", "pow", "//"], ans: 1 },
      { q: "What is the result of 19 // 5?", options: ["3.8", "3", "4", "3.0"], ans: 1 },
      { q: "What is the result of 2 ** 3 ** 2?", options: ["64", "512", "81", "18"], ans: 1 },
      { q: "What does the '%' operator return?", options: ["Quotient", "Percentage", "Remainder", "Division"], ans: 2 },
      { q: "Which of the following has the highest precedence in Python?", options: ["Parentheses ()", "Exponentiation **", "Multiplication *", "Addition +"], ans: 0 },
      { q: "What is the output of print(True + True + False)?", options: ["True", "2", "1", "Error"], ans: 1 },
      { q: "Which operator checks if two values are equal?", options: ["=", "==", "is", "equals"], ans: 1 },

      // Loops
      { q: "Which loop in Python is guaranteed to execute at least once?", options: ["for loop", "while loop", "do-while loop", "None, Python lacks do-while"], ans: 3 },
      { q: "What keyword is used to stop a loop immediately?", options: ["exit", "stop", "break", "return"], ans: 2 },
      { q: "What keyword skips the rest of the current iteration in a loop?", options: ["skip", "pass", "continue", "next"], ans: 2 },
      { q: "What does range(5) generate?", options: ["1 to 5", "0 to 5", "0 to 4", "1 to 4"], ans: 2 },
      { q: "An 'else' block attached to a loop executes when:", options: ["The loop finishes normally without a 'break'", "The loop hits a 'break'", "The loop encounters an error", "Never"], ans: 0 },

      // Functions
      { q: "Which keyword is used to create a function in Python?", options: ["func", "def", "function", "define"], ans: 1 },

      // Code-based MCQs
      { q: "What is the output of the following code?", code: "x = ['Py', 'thon']\nprint(''.join(x))", options: ["Py thon", "Python", "['Py', 'thon']", "Error"], ans: 1 },
      { q: "What does this code output?", code: "a = [1, 2, 3]\nb = a\nb.append(4)\nprint(len(a))", options: ["3", "4", "Error", "None"], ans: 1 },
      { q: "What will be printed?", code: "for i in range(1, 10, 3):\n    print(i, end=' ')", options: ["1 2 3", "1 4 7", "1 3 6 9", "3 6 9"], ans: 1 },
      { q: "What is the result of the expression?", code: "x = 5\ny = 10\nprint(x > 3 and y < 10)", options: ["True", "False", "None", "Error"], ans: 1 },
      { q: "What does this code snippet return?", code: "def add(a, b=2):\n    return a + b\nprint(add(3))", options: ["3", "5", "Error", "None"], ans: 1 },
      { q: "What is the output of this code?", code: "s = 'Python'\nprint(s[1:4])", options: ["Pyt", "yth", "ytho", "pto"], ans: 1 },
      { q: "What will be printed?", code: "i = 0\nwhile i < 3:\n    i += 1\nprint(i)", options: ["2", "3", "0 1 2", "3 3 3"], ans: 1 },
      { q: "What is the output of this code?", code: "print(bool(0), bool(''))", options: ["True True", "False False", "True False", "False True"], ans: 1 },
      { q: "What will this print?", code: "x = 10\ndef my_func():\n    x = 5\nmy_func()\nprint(x)", options: ["5", "10", "UnboundLocalError", "None"], ans: 1 },
      { q: "What is the output?", code: "d = {'a': 1, 'b': 2}\nprint(d.get('c', 3))", options: ["KeyError", "None", "3", "c"], ans: 2 }
    ];

    let currentQ = 0;
    let score = 0;
    let studentName = "";
    let selectedOption = null;
    let timerInterval = null;
    let timeLeft = 15;

    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById("theme-btn");
      if (body.getAttribute("data-theme") === "light") {
        body.removeAttribute("data-theme");
        themeBtn.innerText = "🌙 Dark";
      } else {
        body.setAttribute("data-theme", "light");
        themeBtn.innerText = "☀️ Light";
      }
    }

    function startQuiz() {
      const nameInput = document.getElementById("student-name").value.trim();
      if (!nameInput) {
        alert("Please enter your name!");
        return;
      }
      studentName = nameInput;
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      timeLeft = 15;
      selectedOption = null;
      document.getElementById("timer").innerText = `Time: ${timeLeft}s`;

      const qData = questions[currentQ];
      document.getElementById("question-tracker").innerText = `Question ${currentQ + 1}/30`;
      document.getElementById("question-text").innerText = qData.q;

      const codeBlock = document.getElementById("code-block");
      if (qData.code) {
        document.getElementById("code-text").innerText = qData.code;
        codeBlock.classList.remove("hidden");
      } else {
        codeBlock.classList.add("hidden");
      }

      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      qData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
      });

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = `Time: ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          nextQuestion();
        }
      }, 1000);
    }

    function selectOption(idx, element) {
      selectedOption = idx;
      const options = document.querySelectorAll(".option-btn");
      options.forEach(opt => opt.classList.remove("selected"));
      element.classList.add("selected");
    }

    function nextQuestion() {
      clearInterval(timerInterval);
      if (selectedOption !== null && selectedOption === questions[currentQ].ans) {
        score++;
      }

      currentQ++;
      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");

      const percentage = ((score / questions.length) * 100).toFixed(1);
      document.getElementById("res-name").innerText = studentName;
      document.getElementById("res-score").innerText = score;
      document.getElementById("res-percentage").innerText = percentage;

      let msg = "";
      if (percentage >= 80) {
        msg = "🌟 Outstanding performance! You have mastered the fundamentals of Python. Keep going!";
      } else if (percentage >= 50) {
        msg = "👍 Good job! You have a solid base, but a little more practice will make you unstoppable.";
      } else {
        msg = "💪 Great effort! Don't get discouraged. Review Python core concepts and try again—practice makes perfect!";
      }

      document.getElementById("motivation-msg").innerText = msg;
    }
  </script>
</body>
</html>
